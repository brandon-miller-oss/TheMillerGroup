<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Search | The Miller Group</title>
<meta name="description" content="Search Denver and Colorado homes with The Miller Group. Save homes, get showing times, and message your agent.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --midnight:#141A26; --gold:#B8935A; --gold-strong:#9A7641; --linen:#F4EFE7;
  --bg:#F4EFE7; --surface:#FFFDF9; --surface-2:#EAE3D7; --ink:#141A26; --ink-2:#4E5566;
  --line:#DDD4C5; --accent:#9A7641; --accent-ink:#FFFDF9; --pin:#141A26; --pin-ink:#F4EFE7;
  --love:#2F6B4F; --maybe:#9A7641; --pass:#8A3B3B;
  --map-bg:#E6DED0; --map-line:#CFC4B1; --water:#B9C6CC;
  --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151F; --surface:#182030; --surface-2:#222B3D; --ink:#F4EFE7; --ink-2:#A9AFBC;
    --line:#2C3549; --accent:#C9A56C; --accent-ink:#141A26; --pin:#C9A56C; --pin-ink:#141A26;
    --love:#6FB993; --maybe:#C9A56C; --pass:#D98080;
    --map-bg:#161D2B; --map-line:#26304A; --water:#24364A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151F; --surface:#182030; --surface-2:#222B3D; --ink:#F4EFE7; --ink-2:#A9AFBC;
  --line:#2C3549; --accent:#C9A56C; --accent-ink:#141A26; --pin:#C9A56C; --pin-ink:#141A26;
  --love:#6FB993; --maybe:#C9A56C; --pass:#D98080;
  --map-bg:#161D2B; --map-line:#26304A; --water:#24364A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img,svg{max-width:100%}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:1100px;margin:0 auto}
.brand h1{font:600 26px/1 var(--serif);margin:0;letter-spacing:.01em}
.brand h1 span{color:var(--accent)}
.sync{font-size:12px;color:var(--ink-2);white-space:nowrap}
.searchrow{max-width:1100px;margin:12px auto 0;display:flex;gap:8px}
.searchrow input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.filters{max-width:1100px;margin:10px auto 0;display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;flex:none}

main{max-width:1100px;margin:0 auto;padding:16px 18px 110px}
.banner{font-size:13px;color:var(--ink-2);border-left:3px solid var(--gold);padding:6px 10px;margin:0 0 16px;background:var(--surface)}
.count{font-size:13px;color:var(--ink-2);margin:0 0 12px}

/* Listing cards */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.card .photo{position:relative;aspect-ratio:16/10;display:block}
.card .photo svg{display:block;width:100%;height:100%}
.status{position:absolute;left:10px;top:10px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface);color:var(--ink)}
.heart{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(20,26,38,.55);display:grid;place-items:center}
.heart svg{width:20px;height:20px;fill:none;stroke:#F4EFE7;stroke-width:2}
.heart.on svg{fill:var(--gold);stroke:var(--gold)}
.card .body{padding:12px 14px 14px;cursor:pointer}
.price{font:600 28px/1 var(--serif)}
.specs{font-size:14px;margin-top:6px}
.addr{font-size:13px;color:var(--ink-2);margin-top:2px}
.courtesy{font-size:11px;color:var(--ink-2);margin-top:8px}

/* Map */
.mapwrap{position:relative;background:var(--map-bg);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.mapwrap svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.pin rect{fill:var(--pin)}
.pin text{fill:var(--pin-ink);font:600 12px var(--sans)}
.pin.sel rect{fill:var(--gold-strong)}
.pin.sel text{fill:#FFFDF9}
.maplabel{fill:var(--ink-2);font:italic 500 14px var(--serif)}
.mapcard{margin-top:14px}

/* Collections */
.colhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.colhead h2,.detail h2{font:600 30px/1.1 var(--serif);margin:0}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--ink);color:var(--bg);font-weight:600}
.btn.gold{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.collist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.colcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left}
.colcard h3{font:600 22px/1.2 var(--serif);margin:0}
.colcard p{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.tally{display:flex;gap:12px;margin-top:10px;font-size:13px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--ink-2)}
.empty strong{display:block;color:var(--ink);font:600 22px var(--serif);margin-bottom:6px}
.back{background:none;border:0;padding:0;color:var(--accent);font-weight:600;margin-bottom:10px}
.saved{display:grid;gap:14px}
.saveditem{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:120px 1fr;overflow:hidden}
.saveditem .thumb svg{display:block;width:100%;height:100%;min-height:120px}
.saveditem .info{padding:12px 14px}
.saveditem .price{font-size:22px}
.reactions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.reactions button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px}
.reactions button[aria-pressed="true"][data-r="love"]{background:var(--love);border-color:var(--love);color:#fff}
.reactions button[aria-pressed="true"][data-r="maybe"]{background:var(--maybe);border-color:var(--maybe);color:#fff}
.reactions button[aria-pressed="true"][data-r="pass"]{background:var(--pass);border-color:var(--pass);color:#fff}
.note{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);font-size:13px;resize:vertical;min-height:38px}
.remove{background:none;border:0;color:var(--ink-2);font-size:12px;text-decoration:underline;padding:0;margin-top:8px}

/* Sheets */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:88vh;border-radius:18px 18px 0 0;margin:auto auto 0;overflow:auto}
@media (min-width:700px){dialog{border-radius:18px;margin:auto}}
dialog::backdrop{background:rgba(10,13,20,.55)}
.sheet{padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet .photo svg{display:block;width:100%;border-radius:12px}
.sheettop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheettop h2{font:600 26px/1.1 var(--serif);margin:0}
.close{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;font-size:18px;line-height:1}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.facts div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.facts b{display:block;font:600 22px var(--serif)}
.facts span{font-size:12px;color:var(--ink-2)}
.remarks{font-size:14px;line-height:1.6;max-width:70ch}
.agent{display:flex;gap:12px;align-items:center;padding:14px;background:var(--bg);border-radius:12px;margin:16px 0}
.agent .mono{width:44px;height:44px;border-radius:50%;background:var(--midnight);color:var(--gold);display:grid;place-items:center;font:600 20px var(--serif);flex:none}
.agent p{margin:0;font-size:13px;color:var(--ink-2)}
.agent strong{font-size:15px;color:var(--ink)}
form label{display:block;font-size:13px;font-weight:500;margin:10px 0 4px}
form input,form textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:140px}
.msg{font-size:13px;margin-top:10px}
.colpick{display:grid;gap:8px}
.colpick button{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.colpick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.newcol{display:flex;gap:8px;margin-top:12px}
.newcol input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}

/* Footer + tabs */
.disclaimer{font-size:11px;color:var(--ink-2);margin-top:32px;line-height:1.5;max-width:80ch}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs a{flex:1;max-width:200px;text-align:center;padding:10px 4px 12px;text-decoration:none;color:var(--ink-2);font-size:12px;font-weight:500}
nav.tabs a svg{display:block;margin:0 auto 3px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
nav.tabs a[aria-current="page"]{color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 22px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px}
.stats b{display:block;font:600 30px/1 var(--serif)}
.stats span{font-size:12px;color:var(--ink-2)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.agent-h{font:600 24px/1.2 var(--serif);margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.agent-h .btn{font:600 13px var(--sans);padding:8px 12px}
.req{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.req.new{border-left:4px solid var(--accent)}
.req-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.req-top strong{font-size:16px}
.req select{padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:13px;flex:none}
.req p{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.req .msgtext{color:var(--ink);font-size:14px;margin-top:8px}
.req .contact{display:flex;gap:14px;margin-top:8px;font-size:13px;flex-wrap:wrap}
.req a,.client a{color:var(--accent)}
.client{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.client h3{font:600 22px/1.2 var(--serif);margin:0}
.client .cline{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0;border-top:1px solid var(--line);margin-top:8px}
.client ul{margin:6px 0 0;padding:0;list-style:none}
.client li{font-size:13px;padding:6px 0;border-top:1px dashed var(--line)}
.client li b{font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;color:#fff;margin-right:6px}
.tag.love{background:var(--love)}.tag.maybe{background:var(--maybe)}.tag.pass{background:var(--pass)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;min-height:118px}
.tile-t{font:600 20px/1.15 var(--serif)}
.tile b{font:600 34px/1 var(--serif);margin-top:auto;padding-top:10px;color:var(--accent)}
.tile-s{font-size:12px;color:var(--ink-2);margin-top:4px}
.tile.soon{background:transparent;border-style:dashed}
.tile.soon .tile-t{color:var(--ink-2)}
.quick{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.quick .btn{flex:1;min-width:130px}
.stage-h{display:flex;justify-content:space-between;font:600 20px var(--serif);margin:20px 0 8px}
.stage-h span{font:500 13px var(--sans);color:var(--ink-2)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.pcard-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pcard-top strong{font-size:16px}
.pcard select{padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:13px;flex:none}
.pcard p{margin:3px 0 0;font-size:13px;color:var(--ink-2)}
.links{display:flex;gap:14px;margin-top:8px;font-size:13px;flex-wrap:wrap}
.links a,.links button{color:var(--accent);background:none;border:0;padding:0;font-size:13px;text-decoration:underline}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.task input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.task .tt{flex:1;min-width:0}
.task .tt p{margin:2px 0 0;font-size:12px;color:var(--ink-2)}
.task.done .tt span{text-decoration:line-through;color:var(--ink-2)}
.task.overdue .tt p{color:var(--pass)}
.task button{background:none;border:0;color:var(--accent);font-size:13px;text-decoration:underline;padding:0}
form select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chatlog{max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px 10px}
.chatlog.tall{max-height:calc(100vh - 330px);min-height:220px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.bub{max-width:82%;align-self:flex-start;background:var(--surface-2);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-radius:14px 14px 4px 14px}
.bub time{display:block;font-size:11px;opacity:.7;margin-top:2px}
.bub-home{display:block;background:none;border:0;padding:0 0 4px;color:inherit;font-weight:600;font-size:12px;text-decoration:underline;text-align:left}
.chatform{margin-top:10px}
.chatrow{display:flex;gap:8px;align-items:flex-end}
.chatrow textarea{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);resize:none;max-height:120px}
.about{font-size:12px;color:var(--ink-2);margin:0 0 6px}
.about button{border:0;background:none;color:var(--ink-2);font-size:14px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pass);vertical-align:middle;margin-left:4px}
.badge{display:inline-block;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--pass);color:#fff;font-size:11px;line-height:17px;margin-left:3px;vertical-align:1px}
.badge:empty{display:none}
.thread{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.thread p{margin:2px 0 0;font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.thread time{font-size:12px;color:var(--ink-2);flex:none}
.thread.unread strong::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pass);margin-left:6px;vertical-align:middle}
.notif{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:6px;font-size:14px}
.notif.fresh{border-left:4px solid var(--accent)}
.notif time{display:block;font-size:12px;color:var(--ink-2);margin-top:2px}
.bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin:10px 0 4px}
.bar span{display:block;height:100%;background:var(--accent)}
.bigstat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.bigstat b{font:600 40px/1 var(--serif)}
.bigstat p{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--ink-2);font:11px var(--sans)}
.stop{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.stop .num{width:28px;height:28px;border-radius:50%;background:var(--pin);color:var(--pin-ink);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.stop .tt{flex:1;min-width:0}
.stop .tt p{margin:2px 0 6px;font-size:12px;color:var(--ink-2)}
.stop input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px}
.stopbtns{display:flex;flex-direction:column;gap:4px}
.stopbtns button{width:32px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.tourform label{display:block;font-size:13px;font-weight:500;margin:10px 0 4px}
.tourform input,.tourform select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.check{display:flex!important;gap:8px;align-items:center;font-size:14px!important;margin-top:12px!important}
.check input{width:20px!important;height:20px;accent-color:var(--accent)}
.tourmap{margin:14px 0;background:var(--map-bg);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.tourmap svg{display:block;width:100%;height:auto}
.tourmap .n{fill:var(--pin)}.tourmap .nt{fill:var(--pin-ink);font:600 12px var(--sans)}
.status.ex{background:var(--midnight);color:var(--gold)}
.mtable{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mtable th,.mtable td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.mtable th:first-child,.mtable td:first-child{text-align:left}
.mtable th{font-weight:600;font-size:12px;color:var(--ink-2);background:var(--surface-2)}
.scroll{overflow-x:auto}
.note-c{font-size:12px;color:var(--ink-2);border-left:3px solid var(--gold);padding:6px 10px;background:var(--surface);margin:12px 0}
.flyer{max-width:420px;margin:12px auto;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.flyer svg{display:block;width:100%;height:auto}
.caps textarea{width:100%;min-height:110px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px}
.caps label{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;margin:14px 0 4px}
.caps label button{font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;text-align:left}
.bub.ai{background:var(--surface);border:1px solid var(--line)}
.roster-search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:12px}
.sstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 0 12px;align-items:center;scrollbar-width:none}
.sstrip::-webkit-scrollbar{display:none}
.sstrip > *{flex:none}
.btn.small{padding:7px 12px;font-size:13px}
.schip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px}
.schip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ohline{font-size:12px;font-weight:600;color:var(--accent);margin-top:4px}
details.pay{background:var(--bg);border-radius:12px;padding:12px 14px;margin:12px 0}
details.pay summary{cursor:pointer;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.pay summary::-webkit-details-marker{display:none}
details.pay summary b{font:600 20px var(--serif)}
details.pay label{display:block;font-size:12px;margin:10px 0 4px}
details.pay input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.pay .btn{display:inline-block;text-decoration:none;margin-top:8px}
.flag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--pass);color:#fff;white-space:nowrap}
.adjlist{margin:8px 0 2px}.adjlist p{margin:3px 0}
.toolfind{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:18px 0 4px;font-size:15px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tool{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);min-height:132px}
.tool:hover{border-color:var(--accent)}
.tool .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--accent);color:var(--accent)}
.tool .ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool strong{font:600 17px/1.15 var(--serif)}
.tool span.d{font-size:12px;line-height:1.35;color:var(--ink-2)}
.tool .ct{position:absolute;top:12px;right:12px;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;line-height:22px;text-align:center}
.tool.broker .ic{border-style:dashed}
.toolsec[hidden],.tool[hidden]{display:none}
@media (max-width:420px){.tools{grid-template-columns:repeat(2,1fr)}.tool{min-height:122px;padding:12px}}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:10px}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:15px}
.menu button:last-child{border-bottom:0}
.menu button::after{content:"›";color:var(--accent);font-size:20px;line-height:1}
.menu button span{font-size:12px;color:var(--ink-2);margin-left:auto;margin-right:10px}
.cmares{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.cmares b{font:600 34px/1.1 var(--serif);display:block}
.cmares p{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.mtable input{width:92px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:right;font-size:13px}
.complist label{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:13px}
.complist input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.kiosk h2{font:600 30px/1.15 var(--serif);margin:0 0 4px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}

.hidden{display:none!important}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:rise .22s ease-out}@keyframes rise{from{transform:translateY(24px);opacity:.6}}}

<script>
/* =========================================================================
   IDX CONFIGURATION
   Everything listing-related goes through ListingProvider below. Sample data
   is stored in RESO Data Dictionary field names, so switching to a live feed
   means flipping MODE to "reso" and pointing ENDPOINT at your IDX proxy.

   Keep the MLS bearer token on the server. The browser calls your proxy
   (e.g. a Vercel function on the TheMillerGroup site), the proxy calls the
   REcolorado RESO Web API (OData) and returns the JSON untouched.
   ========================================================================= */
const SITE = window.MG_CONFIG || {};
const IDX = {
  MODE: SITE.IDX_ENDPOINT ? "reso" : "sample",   // sample listings until the IDX proxy address is set in assets/config.js
  ENDPOINT: SITE.IDX_ENDPOINT || "",             // e.g. https://miller-tools.vercel.app/api/idx
  MLS_NAME: "REcolorado",
  PAGE_SIZE: 50,
  APP_URL: (SITE.SITE_URL || location.origin) + "/search/",
  // Shows the Agent tab with sample data to anyone who isn't you, for testing. Set to false at launch.
  DEMO_AGENT: SITE.DEMO_MODE === true,   // set in assets/config.js
  // Replace with the exact disclaimer text your MLS requires for IDX display.
  DISCLAIMER: "Listing information is deemed reliable but not guaranteed. IDX information is provided exclusively for consumers’ personal, non-commercial use and may not be used for any purpose other than to identify prospective properties consumers may be interested in purchasing.",
  BROKER: { name: "Brandon Miller", firm: SITE.BUSINESS_NAME || "The Miller Group", phone: SITE.PHONE || "303-990-0702" },
  DEFAULT_AGENT_SLUG: SITE.DEFAULT_AGENT_SLUG || "brandon"
};

// RESO fields the app reads. Used as $select on the live feed.
const RESO_FIELDS = ["ListingKey","ListingId","StandardStatus","ListPrice","BedroomsTotal","BathroomsTotalInteger","LivingArea","LotSizeAcres","YearBuilt","PropertySubType","UnparsedAddress","City","StateOrProvince","PostalCode","SubdivisionName","Latitude","Longitude","PublicRemarks","ListOfficeName","ListAgentFullName","OnMarketDate","ModificationTimestamp"];

// Builds the OData $filter string for the RESO Web API from the app's filters.
function buildODataFilter(f){
  const parts = [];
  if (f.status) parts.push(`StandardStatus eq '${f.status}'`);
  else parts.push(`(StandardStatus eq 'Active' or StandardStatus eq 'Coming Soon')`);
  if (f.maxPrice) parts.push(`ListPrice le ${Number(f.maxPrice)}`);
  if (f.minBeds) parts.push(`BedroomsTotal ge ${Number(f.minBeds)}`);
  if (f.type) parts.push(`PropertySubType eq '${f.type.replace(/'/g,"''")}'`);
  if (f.text){
    const t = f.text.replace(/'/g,"''");
    parts.push(`(contains(City,'${t}') or contains(SubdivisionName,'${t}') or contains(UnparsedAddress,'${t}') or PostalCode eq '${t}')`);
  }
  return parts.join(" and ");
}
const ODATA_ORDER = { new:"OnMarketDate desc", plo:"ListPrice asc", phi:"ListPrice desc", sqft:"LivingArea desc" };

// One shape for the whole UI, whatever the source.
function normalize(r){
  return {
    key: r.ListingKey, mlsId: r.ListingId, status: r.StandardStatus,
    price: r.ListPrice, beds: r.BedroomsTotal, baths: r.BathroomsTotalInteger,
    sqft: r.LivingArea, lot: r.LotSizeAcres, year: r.YearBuilt, type: r.PropertySubType,
    address: r.UnparsedAddress, city: r.City, state: r.StateOrProvince, zip: r.PostalCode,
    hood: r.SubdivisionName, lat: r.Latitude, lng: r.Longitude, remarks: r.PublicRemarks,
    office: r.ListOfficeName, agent: r.ListAgentFullName, listed: r.OnMarketDate, exclusive: !!r.exclusive, published: r.published!==false,
    photos: (r.Media||[]).filter(m=>m.MediaCategory==="Photo").sort((a,b)=>(a.Order||0)-(b.Order||0)).map(m=>m.MediaURL)
  };
}

/* Office exclusives and Miller Group coming soons: entered by you, not in the MLS feed. */
function exclusiveRecords(){
  if (Store.demo) return [...Object.values(Store.publicEx), ...Object.values(Store.crm.exclusives)].filter(Boolean);
  if (Store.isAgent){ const m = new Map(); Object.values(Store.publicEx).filter(Boolean).forEach(r=>m.set(r.ListingKey,r)); Object.values(Store.crm.exclusives).filter(Boolean).forEach(r=>m.set(r.ListingKey,r)); return [...m.values()]; }
  return Object.values(Store.publicEx).filter(Boolean);
}
function matchExclusive(l, f){
  if (f.status && f.status!=="Private Exclusive" && f.status!==l.status) return false;
  if (f.maxPrice && l.price > +f.maxPrice) return false;
  if (f.minBeds && l.beds < +f.minBeds) return false;
  if (f.type && l.type !== f.type) return false;
  if (f.text){ const t = f.text.toLowerCase(); if (![l.city,l.hood,l.address,l.zip].some(v=>String(v||"").toLowerCase().includes(t))) return false; }
  return true;
}
const exByKey = k=>exclusiveRecords().find(r=>r.ListingKey===k);
const ListingProvider = {
  cache: new Map(),
  async search(f){
    const ex = exclusiveRecords().map(normalize).filter(l=>matchExclusive(l,f));
    ex.forEach(l=>this.cache.set(l.key,l));
    if (f.status==="Private Exclusive") return ex.filter(l=>l.status==="Private Exclusive");
    const base = await this.searchFeed(f);
    return [...ex, ...base];
  },
  async searchFeed(f){
    if (IDX.MODE === "reso"){
      const p = new URLSearchParams({
        "$filter": buildODataFilter(f), "$orderby": ODATA_ORDER[f.sort]||ODATA_ORDER.new,
        "$top": String(IDX.PAGE_SIZE)
      });
      const res = await fetch(`${IDX.ENDPOINT}?${p}`);
      if (!res.ok) throw new Error(`IDX request failed (${res.status})`);
      const json = await res.json();
      const list = (json.value||[]).map(normalize);
      list.forEach(l=>this.cache.set(l.key,l));
      return list;
    }
    // Sample mode: same filter logic, run locally.
    let list = SAMPLE.map(normalize).filter(l=>{
      if (f.status ? l.status!==f.status : !["Active","Coming Soon"].includes(l.status)) return false;
      if (f.maxPrice && l.price > +f.maxPrice) return false;
      if (f.minBeds && l.beds < +f.minBeds) return false;
      if (f.type && l.type !== f.type) return false;
      if (f.text){
        const t = f.text.toLowerCase();
        if (![l.city,l.hood,l.address,l.zip].some(v=>String(v||"").toLowerCase().includes(t))) return false;
      }
      return true;
    });
    const s = { new:(a,b)=>b.listed.localeCompare(a.listed), plo:(a,b)=>a.price-b.price, phi:(a,b)=>b.price-a.price, sqft:(a,b)=>b.sqft-a.sqft }[f.sort] || ((a,b)=>b.listed.localeCompare(a.listed));
    list.sort(s);
    list.forEach(l=>this.cache.set(l.key,l));
    return list;
  },
  async get(key){
    const ex = exByKey(key); if (ex) return normalize(ex);
    if (this.cache.has(key)) return this.cache.get(key);
    if (IDX.MODE === "reso"){
      const res = await fetch(`${IDX.ENDPOINT}?key=${encodeURIComponent(key)}`);
      if (!res.ok) return null;
      const rec = ((await res.json()).value||[])[0]; if (!rec) return null;
      const l = normalize(rec); this.cache.set(key,l); return l;
    }
    const r = SAMPLE.find(x=>x.ListingKey===key); return r ? normalize(r) : null;
  }
};

/* =========================================================================
   DATA STORE — artifact database when available, this browser otherwise.
   boards/<clientId>/collections/<id>  each client's collections (private to

   leads/<clientId>                     that client's showing requests
   ========================================================================= */
const Store = {
  cols:{}, mode:"local", db:null, user:null, uid:null, isAgent:false, subs:[], queues:{},
  clients:{}, clientSubs:{}, leads:{}, names:{}, markerDone:false, crm:{contacts:{},tasks:{},tours:{},exclusives:{},openhouses:{},ohvisitors:{},cmas:{},referrals:{},expenses:{},recruits:{},emaillog:{},scripts:{},presentations:{},buyerpres:{}}, publicEx:{}, roster:{}, exVer:0,
  searches:{}, searchVer:0, publicOH:{}, showcase:{}, demoShowcase:{}, site:{},
  team:{}, isBroker:false, crmOwner:null, myAgent:null, marker:null,
  threads:{}, msgs:{}, msgSubs:{}, myThread:null, myTours:{}, settings:{}, agentThread:null,
  load(){
    try{ this.cols = JSON.parse(localStorage.getItem("tmg-collections")||"{}"); }catch(e){ this.cols={}; }
    try{ this.searches = JSON.parse(localStorage.getItem("tmg-searches")||"{}"); }catch(e){ this.searches={}; }
    this.searchVer++;

  async connect(){
    this.load(); this.emit();
    try{
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      // Public data loads for everyone, signed in or not.
      db.collection("openhouses").onSnapshot(sn=>{ const m = {}; sn.docs.forEach(d=>{ m[d.id] = d.data(); }); this.publicOH = m; this.emit(); }, ()=>{});
      db.collection("showcase").onSnapshot(sn=>{ const m = {}; sn.docs.forEach(d=>{ m[d.id] = d.data(); }); this.showcase = m; this.emit(); }, ()=>{});
      db.collection("team").onSnapshot(sn=>{ const m = {}; sn.docs.forEach(d=>{ m[d.id] = d.data(); }); this.team = m; this.roster = m; this.refreshProfile(); this.emit(); }, ()=>{});
      db.collection("exclusives").onSnapshot(sn=>{ const m = {}; sn.docs.forEach(d=>{ m[d.id] = d.data(); }); this.publicEx = m; this.exVer++; this.emit(); }, ()=>{});
      const uid = await user.id(); if (!uid) return;
      this.db = db; this.user = user; this.uid = uid;
      setSync("Connecting…");
      this.isAgent = await user.canEdit();
      if (!this.isAgent) await this.assignAgent();
      const timer = setTimeout(()=>setSync("Saved on this device"), 10000);
      db.collection(`boards/${uid}/collections`).onSnapshot(snap=>{
        clearTimeout(timer);
        const next = {}; snap.docs.forEach(d=>{ next[d.id] = d.data(); });
        this.cols = next; this.mode = "shared"; setSync("Synced"); this.emit();
      }, ()=>{ clearTimeout(timer); this.db=null; this.mode="local"; this.load(); setSync("Saved on this device"); this.emit(); });
      db.doc(`threads/${uid}`).onSnapshot(d=>{ this.myThread = d.exists ? d.data() : null; this.emit(); }, ()=>{});
      this.watchMessages(uid);
      db.collection(`boards/${uid}/searches`).onSnapshot(sn=>{ const m = {}; sn.docs.forEach(d=>{ m[d.id] = d.data(); }); this.searches = m; this.searchVer++; this.emit(); }, ()=>{});
      db.collection(`boards/${uid}/tours`).onSnapshot(sn=>{ const m = {}; sn.docs.forEach(d=>{ m[d.id] = d.data(); }); this.myTours = m; this.emit(); }, ()=>{});
      this.isBroker = this.isAgent && !!(await window.MillerCloud?.isBroker?.());
      let viewAs = null; try{ viewAs = sessionStorage.getItem("tmg-view-as"); }catch(e){}
      this.crmOwner = this.isBroker && viewAs ? viewAs : uid;
      if (this.isAgent){ this.refreshProfile(); this.watchAgent(); }
      this.emit();
    }catch(e){ /* stay local */ }
  },
  // Each client belongs to one agent, set from the agent's personal link (?agent=slug).
  async assignAgent(){
    const ref = this.db.doc(`boards/${this.uid}`);
    let cur = null; try{ const d = await ref.get(); cur = d.exists ? d.data() : null; }catch(e){}
    this.marker = cur || {};
    if (!cur || !cur.agentId){
      let slug = ""; try{ slug = localStorage.getItem("tmg-agent-slug") || ""; }catch(e){}
      const agentId = await resolveAgentSlug(slug || IDX.DEFAULT_AGENT_SLUG);
      if (agentId && agentId!==this.uid){ this.marker = { ...(cur||{}), agentId, updatedAt:new Date().toISOString() }; this.markerDone = true; try{ await ref.set(this.marker); }catch(e){} }
    }
    this.myAgent = this.marker.agentId || null;
    this.refreshProfile();
  },
  refreshProfile(){
    const id = this.isAgent ? this.crmOwner : this.myAgent;
    const p = (id && this.team[id]) || {};
    this.site = p; applyProfile();
  },
  markerBody(){ return { ...(this.marker||{}), updatedAt:new Date().toISOString() }; },
  watchAgent(){
    window.Office?.watch?.();
    this.db.collection("boards").onSnapshot(snap=>{
      const fresh = [];
      snap.docs.forEach(d=>{
        const cid = d.id;
        if (cid===this.uid || this.clientSubs[cid] || this.team[cid]) return;
        fresh.push(cid);
        this.clients[cid] = { cols:{}, searches:{} };
        this.clientSubs[cid] = this.db.collection(`boards/${cid}/collections`).onSnapshot(s=>{
          const m = {}; s.docs.forEach(x=>{ m[x.id] = x.data(); });
          this.clients[cid].cols = m; this.emit();
        }, ()=>{});
        this.db.collection(`boards/${cid}/searches`).onSnapshot(s=>{
          const m = {}; s.docs.forEach(x=>{ m[x.id] = x.data(); });
          this.clients[cid].searches = m; this.emit();
        }, ()=>{});
      });
      if (fresh.length) this.resolveNames(fresh);
      this.emit();
    }, ()=>{});
    this.db.collection("threads").onSnapshot(sn=>{
      const m = {}; sn.docs.forEach(d=>{ m[d.id] = d.data(); });
      const fresh = Object.keys(m).filter(id=>!(id in this.names));
      this.threads = m; if (fresh.length) this.resolveNames(fresh); this.emit();
    }, ()=>{});
    this.db.doc(`agent/${this.crmOwner}/settings`).onSnapshot(d=>{ this.settings = d.exists ? d.data() : {}; this.emit(); }, ()=>{});
    ["contacts","tasks","tours","exclusives","openhouses","ohvisitors","cmas"].forEach(k=>this.db.collection(`agent/${this.crmOwner}/crm/${k}`).onSnapshot(sn=>{
      const m = {}; sn.docs.forEach(d=>{ m[d.id] = d.data(); }); this.crm[k] = m; if (k==="exclusives") this.exVer++; this.emit();
    }, ()=>{}));
    this.db.collection("leads").onSnapshot(snap=>{
      const m = {}; snap.docs.forEach(d=>{ m[d.id] = d.data(); });
      const fresh = Object.keys(m).filter(id=>!(id in this.names));
      this.leads = m; if (fresh.length) this.resolveNames(fresh);
      this.emit();
    }, ()=>{});
  },
  async resolveNames(ids){
    ids.forEach(id=>{ if(!(id in this.names)) this.names[id] = ""; });
    const ps = await this.user.profiles(ids);
    ids.forEach(id=>{ if (ps[id] && ps[id].name) this.names[id] = ps[id].name; });
    this.emit();
  },
  clientName(cid){
    const reqs = Object.values(this.leads[cid]?.requests||{}).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
    return (reqs[0] && reqs[0].name) || this.names[cid] || "Unnamed client";
  },
  queue(key, fn){
    const q = (this.queues[key]||Promise.resolve()).then(fn);
    this.queues[key] = q.catch(()=>{ toast("That change didn’t save. Check your connection and try again."); });
    return q;
  },
  write(id, data){
    this.cols[id] = data; this.emit();
    if (!this.db){ this.persistLocal(); return Promise.resolve(); }
    if (!this.markerDone){ this.markerDone = true; this.queue("marker", ()=>this.db.doc(`boards/${this.uid}`).set(this.markerBody())); }
    const ref = this.db.doc(`boards/${this.uid}/collections/${id}`);
    return this.queue(id, ()=> data ? ref.set(data) : ref.delete());
  },
  create(name){
    const id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    this.write(id, { name, createdAt:new Date().toISOString(), items:{} });
    return id;
  },
  toggle(id, key){
    const c = structuredClone(this.cols[id]); if(!c) return;
    c.items = c.items||{};
    if (c.items[key]) delete c.items[key]; else c.items[key] = { addedAt:new Date().toISOString(), updatedAt:new Date().toISOString(), reaction:"", note:"" };
    this.write(id, c);
  },
  setItem(id, key, patch){
    const c = structuredClone(this.cols[id]); if(!c||!c.items[key]) return;
    Object.assign(c.items[key], patch, { updatedAt:new Date().toISOString() }); this.write(id, c);
  },
  remove(id){ delete this.cols[id]; this.write(id, null); },
  saveSearch(id, data){
    id = id || "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    if (data) this.searches[id] = data; else delete this.searches[id];
    this.searchVer++; this.emit();
    if (!this.db){ try{ localStorage.setItem("tmg-searches", JSON.stringify(this.searches)); }catch(e){} return id; }
    if (!this.markerDone){ this.markerDone = true; this.queue("marker", ()=>this.db.doc(`boards/${this.uid}`).set(this.markerBody())); }
    const ref = this.db.doc(`boards/${this.uid}/searches/${id}`);
    this.queue("search"+id, ()=> data ? ref.set(data) : ref.delete());
    return id;
  },
  saveOpenHouse(id, oh){
    id = this.saveCrm("openhouses", id, oh);
    if (!this.db || this.demo) return id;
    const pub = this.db.doc(`openhouses/${id}`);
    this.queue("ohpub"+id, ()=> oh && oh.published ? pub.set({ listingKey:oh.listingKey, date:oh.date, start:oh.start, end:oh.end, notes:oh.notes||"", agentId:this.crmOwner }) : pub.delete());
    return id;
  },
  saveShowcase(id, sc){
    id = id || "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    const bag = this.demo ? this.demoShowcase : this.showcase;
    if (sc) bag[id] = sc; else { delete this.demoShowcase[id]; delete this.showcase[id]; }
    this.emit();
    if (!this.db || this.demo) return id;
    const ref = this.db.doc(`showcase/${id}`);
    if (sc) sc.agentId = sc.agentId || this.crmOwner;
    this.queue("sc"+id, ()=> sc ? ref.set(sc) : ref.delete());
    return id;
  },
  saveProfile(patch){
    const id = this.crmOwner;
    this.site = { ...this.site, ...patch, updatedAt:new Date().toISOString() }; if (id) this.team[id] = this.site; applyProfile(); this.emit();
    if (!this.db || this.demo || !id) return Promise.resolve();
    const body = { ...this.site };
    return this.queue("team"+id, ()=>this.db.doc(`team/${id}`).set(body));
  },
  isSaved(key){ return Object.values(this.cols).some(c=>c && c.items && c.items[key]); },
  async addLead(lead){
    if (!this.db) return false;
    const id = "r" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    const ref = this.db.doc(`leads/${this.uid}`);
    await this.queue("lead", async ()=>{
      const cur = await ref.get();
      const body = cur.exists ? cur.data() : { requests:{} };
      body.requests = body.requests || {};
      body.requests[id] = { ...lead, status:"new" };
      body.updatedAt = lead.createdAt;
      await ref.set(body);
    });
    return true;
  },
  saveCrm(kind, id, data){
    id = id || kind[0] + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    if (data) this.crm[kind][id] = data; else delete this.crm[kind][id];
    this.emit();
    if (!this.db || this.demo) return id;
    const ref = this.db.doc(`agent/${this.crmOwner}/crm/${kind}/${id}`);
    this.queue(kind+id, ()=> data ? ref.set(data) : ref.delete());
    return id;
  },
  watchMessages(cid){
    if (this.msgSubs[cid]) return;
    this.msgSubs[cid] = this.db.collection(`threads/${cid}/messages`).orderBy("createdAt","desc").limit(150).onSnapshot(sn=>{
      this.msgs[cid] = sn.docs.map(d=>({ id:d.id, ...d.data() })).reverse(); this.emit();
    }, ()=>{});
  },
  openAgentThread(cid){
    if (this.demo){ this.agentThread = cid; this.markRead(cid, "agent"); return; }
    if (!this.db) return;
    if (this.agentThread && this.agentThread!==cid && this.agentThread!==this.uid && this.msgSubs[this.agentThread]){ this.msgSubs[this.agentThread](); delete this.msgSubs[this.agentThread]; }
    this.agentThread = cid; this.watchMessages(cid); this.markRead(cid, "agent");
  },
  unread(t, who){ if (!t) return false; const f = who==="agent" ? "lastReadAgent" : "lastReadClient"; return t.lastFrom!==who && (t.updatedAt||"") > (t[f]||""); },
  markRead(cid, who){
    if (!this.db && !(this.demo && who==="agent")) return;
    const t = who==="agent" ? this.threads[cid] : this.myThread;
    if (!this.unread(t, who)) return;
    const f = who==="agent" ? "lastReadAgent" : "lastReadClient";
    t[f] = new Date().toISOString(); this.emit();
    if (!(this.demo && who==="agent")) this.queue("thread"+cid, ()=>this.db.doc(`threads/${cid}`).update({ [f]:t[f] }));
  },
  async sendMessage(cid, from, text, listingKey){
    if (!this.db && !(this.demo && from==="agent")) return false;
    const now = new Date().toISOString();
    const mid = "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    const msg = { from, text, createdAt:now }; if (listingKey) msg.listingKey = listingKey;
    (this.msgs[cid] = this.msgs[cid]||[]).push({ id:mid, ...msg }); this.emit();
    if (this.demo && from==="agent"){ this.threads[cid] = { ...(this.threads[cid]||{}), updatedAt:now, lastText:text.slice(0,140), lastFrom:"agent", lastReadAgent:now }; this.emit(); return true; }
    await this.queue("msg"+cid, ()=>this.db.doc(`threads/${cid}/messages/${mid}`).set(msg));
    const cur = from==="agent" ? this.threads[cid] : this.myThread;
    const patch = { updatedAt:now, lastText:text.slice(0,140), lastFrom:from, [from==="agent"?"lastReadAgent":"lastReadClient"]:now };
    const ref = this.db.doc(`threads/${cid}`);
    await this.queue("thread"+cid, ()=> cur ? ref.update(patch) : ref.set(patch));
    return true;
  },
  saveSettings(patch){
    this.settings = { ...this.settings, ...patch }; this.emit();
    if (!this.db || this.demo) return; const body = { ...this.settings };
    this.queue("settings", ()=>this.db.doc(`agent/${this.crmOwner}/settings`).set(body));
  },
  saveExclusive(id, rec){
    if (rec) this.crm.exclusives[id] = rec; else delete this.crm.exclusives[id];
    this.exVer++; this.emit();
    if (!this.db || this.demo) return;
    const priv = this.db.doc(`agent/${this.crmOwner}/crm/exclusives/${id}`), pub = this.db.doc(`exclusives/${id}`);
    if (rec) rec.agentId = this.crmOwner;
    this.queue("ex"+id, ()=> rec ? priv.set(rec) : priv.delete());
    this.queue("expub"+id, ()=> rec && rec.published ? pub.set(rec) : pub.delete());

  saveRoster(id, rec){
    id = id || "a" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    if (rec) this.roster[id] = rec; else delete this.roster[id];
    this.emit();
    if (!this.db || this.demo) return id;
    const ref = this.db.doc(`team/${id}`);
    this.queue("roster"+id, ()=> rec ? ref.set({ ...(this.team[id]||{}), ...rec }) : ref.delete());
    return id;
  },
  saveTour(id, tour){
    const prev = id ? this.crm.tours[id] : null;
    const target = tour && tour.shared && tour.clientId ? tour.clientId : "";
    if (tour) tour.sharedTo = target;
    id = this.saveCrm("tours", id, tour);
    if (!this.db || this.demo) return id;
    const old = prev && prev.sharedTo;
    if (old && old!==target) this.queue("share"+id, ()=>this.db.doc(`boards/${old}/tours/${id}`).delete());
    if (target){ const pub = { name:tour.name||"Tour", date:tour.date||"", stops:tour.stops||[], updatedAt:new Date().toISOString() }; this.queue("share"+id, ()=>this.db.doc(`boards/${target}/tours/${id}`).set(pub)); }
    return id;
  },
  setLeadStatus(cid, rid, status){
    if (!this.isAgent) return;
    const l = this.leads[cid]; if (l && l.requests && l.requests[rid]) l.requests[rid].status = status;
    this.emit();
    if (!this.db || this.demo) return;
    return this.queue("lead-"+cid, ()=>this.db.doc(`leads/${cid}`).update({ requests:{ [rid]:{ status } } }));
  }
};

function pathFrom(pts){ return pts.map((p,i)=>(i?"L":"M")+px(p[0],p[1]).map(n=>n.toFixed(1)).join(" ")).join(" "); }
function renderMap(){

  }).join("");

    <rect width="${W}" height="${H}" fill="var(--map-bg)"/>

/* GCI tracker */
function parseMoney(v){ const m = String(v??"").replace(/[$,\s]/g,"").match(/^([\d.]+)([kKmM]?)/); if (!m) return 0; let n = parseFloat(m[1]); if (/k/i.test(m[2])) n*=1e3; if (/m/i.test(m[2])) n*=1e6; return isFinite(n) ? n : 0; }
function bizStats(){
  const rate = Number(Store.settings.commissionRate ?? 2.5), goal = Number(Store.settings.gciGoal||0), yr = String(new Date().getFullYear());
  const ds = [];
  contacts().forEach(c=>{
    if (isBuyer(c)) ds.push({ c, stage:c.buyerStage||"lead", value:parseMoney(c.salePrice)||parseMoney(c.budget) });
    if (isSeller(c)) ds.push({ c, stage:c.sellerStage||"prospect", value:parseMoney(c.salePrice)||parseMoney(c.listPrice) });
  });
  const gci = d=>d.value*rate/100, sum = a=>a.reduce((t,d)=>t+gci(d),0);
  const closed = ds.filter(d=>d.stage==="closed" && (d.c.closeDate||d.c.updatedAt||"").startsWith(yr));
  const pend = ds.filter(d=>d.stage==="contract");
  const active = ds.filter(d=>["searching","touring","prep","active"].includes(d.stage));
  const early = ds.filter(d=>["lead","prospect"].includes(d.stage));
  const months = Array(12).fill(0); closed.forEach(d=>{ const mo = Number((d.c.closeDate||d.c.updatedAt||"").slice(5,7)); if (mo) months[mo-1] += gci(d); });
  return { rate, goal, yr, closed, pend, active, early, closedG:sum(closed), pendG:sum(pend), activeG:sum(active), earlyG:sum(early), months };
}
function bizHTML(){
  const b = bizStats(), pct = b.goal ? Math.min(100, b.closedG/b.goal*100) : 0;
  const mx = Math.max(...b.months, 1), labels = "JFMAMJJASOND";
  const bars = b.months.map((v,i)=>{ const h = v/mx*100; return `<rect x="${i*30+6}" y="${110-h}" width="18" height="${Math.max(h,1)}" rx="3" fill="${v?"var(--accent)":"var(--line)"}"><title>${money(v)}</title></rect><text x="${i*30+15}" y="126" text-anchor="middle">${labels[i]}</text>`; }).join("");
  const card = (n,t,sub)=>`<div><b>${n}</b><span>${t}${sub?`<br>${sub}`:""}</span></div>`;
  return `<div class="bigstat"><p>Closed GCI in ${b.yr}</p><b>${money(b.closedG)}</b>
      ${b.goal ? `<div class="bar"><span style="width:${pct.toFixed(1)}%"></span></div><p>${pct.toFixed(0)}% of your ${money(b.goal)} goal</p>` : `<p>Set a yearly goal to track progress.</p>`}</div>
    <div class="stats">${card(short(b.pendG||0),"Under contract",`${b.pend.length} deals`)}${card(short(b.activeG||0),"Active pipeline",`${b.active.length} deals`)}${card(short(b.earlyG||0),"Leads and prospects",`${b.early.length}`)}${card(b.closed.length,"Closed",`this year`)}</div>
    <p class="addr">GCI estimates use ${b.rate}% of the contract price, or of the budget or list price until there’s a contract.</p>
    <div class="chart"><svg viewBox="0 0 360 132" role="img" aria-label="Closed GCI by month">${bars}</svg></div>`;
}

function editTour(id, fn){ const t = structuredClone(Store.crm.tours[id]); if (!t) return; t.stops = t.stops||[]; fn(t); t.updatedAt = new Date().toISOString(); Store.saveTour(id, t); }
function optimizeStops(stops){
  const pts = stops.map(s=>({ s, l:listingSync(s.listingKey) }));
  if (pts.some(p=>!p.l)) return stops;
  const times = stops.map(s=>s.time).filter(Boolean).sort();
  const out = [pts.shift()];
  while (pts.length){
    const last = out[out.length-1].l; let bi = 0, bd = Infinity;
    pts.forEach((p,i)=>{ const d = (p.l.lat-last.lat)**2 + ((p.l.lng-last.lng)*0.77)**2; if (d<bd){ bd=d; bi=i; } });
    out.push(pts.splice(bi,1)[0]);
  }
  const res = out.map(p=>({ ...p.s }));
  if (times.length===res.length) res.forEach((s,i)=>s.time = times[i]);
  return res;
}
function newTour(contactId){
  const c = contactId ? Store.crm.contacts[contactId] : null;
  const loved = c && c.clientId ? clientItems(c.clientId).filter(i=>i.reaction==="love").map(i=>({ listingKey:i.key, time:"", note:"" })) : [];

  agentPanel = "tour:"+id; renderAgent(); window.scrollTo(0,0);
}

const median = a=>{ if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y), m=Math.floor(s.length/2); return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };
const daysSince = d=>d ? Math.max(0, Math.round((Date.now()-new Date(d+"T12:00"))/864e5)) : 0;

/* Market pulse */
function marketHTML(){
  const all = (IDX.MODE==="sample" ? SAMPLE.map(normalize) : results.filter(l=>!l.exclusive));
  const by = {};
  all.forEach(l=>{ (by[l.hood] = by[l.hood]||[]).push(l); });
  const rows = Object.entries(by).map(([h,ls])=>{
    const act = ls.filter(l=>l.status==="Active");
    return { h, active:act.length, soon:ls.filter(l=>l.status==="Coming Soon").length, pend:ls.filter(l=>l.status==="Pending").length,
      med:median(ls.filter(l=>l.status!=="Pending").map(l=>l.price)), ppsf:median(ls.filter(l=>l.sqft).map(l=>l.price/l.sqft)), dom:Math.round(median(act.map(l=>daysSince(l.listed)))) };
  }).sort((a,b)=>b.ppsf-a.ppsf);
  const fresh = all.filter(l=>daysSince(l.listed)<=7 && l.status!=="Pending").sort((a,b)=>b.listed.localeCompare(a.listed));
  const mx = Math.max(...rows.map(r=>r.ppsf),1), bh = 26;
  const chart = `<svg viewBox="0 0 360 ${rows.length*bh+8}" role="img" aria-label="Median price per square foot by neighborhood">${rows.map((r,i)=>`<text x="0" y="${i*bh+17}">${esc(r.h.length>16?r.h.slice(0,15)+"…":r.h)}</text><rect x="118" y="${i*bh+5}" width="${(r.ppsf/mx*190).toFixed(1)}" height="16" rx="3" fill="var(--accent)"/><text x="${(118+r.ppsf/mx*190+6).toFixed(1)}" y="${i*bh+17}">$${Math.round(r.ppsf)}</text>`).join("")}</svg>`;
  return `${IDX.MODE==="sample"?`<p class="note-c">Built from sample listings. With the IDX feed connected, add closed sales from the MLS to show sold prices and true days on market.</p>`:`<p class="note-c">Built from your current search results.</p>`}
    <div class="stats">${[["Active",all.filter(l=>l.status==="Active").length],["Coming soon",all.filter(l=>l.status==="Coming Soon").length],["Pending",all.filter(l=>l.status==="Pending").length],["Median list",short(median(all.filter(l=>l.status!=="Pending").map(l=>l.price)))]].map(([t,n])=>`<div><b>${n}</b><span>${t}</span></div>`).join("")}</div>
    <h3 class="agent-h">New this week</h3>
    ${fresh.length ? `<div class="saved">${fresh.map(l=>`<button class="notif" data-open="${esc(l.key)}"><strong>${money(l.price)}</strong> · ${esc(l.address)}, ${esc(l.hood)}<time>${l.status} · listed ${daysSince(l.listed)===0?"today":daysSince(l.listed)+(daysSince(l.listed)===1?" day ago":" days ago")}</time></button>`).join("")}</div>` : `<p class="addr">No new listings in the last 7 days.</p>`}
    <h3 class="agent-h">By neighborhood</h3>
    <div class="scroll"><table class="mtable"><thead><tr><th>Neighborhood</th><th>Active</th><th>Soon</th><th>Pending</th><th>Median</th><th>$/sq ft</th><th>Days</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${esc(r.h)}</td><td>${r.active}</td><td>${r.soon}</td><td>${r.pend}</td><td>${short(r.med)}</td><td>$${Math.round(r.ppsf)}</td><td>${r.active?r.dom:"–"}</td></tr>`).join("")}</tbody></table></div>

}

/* Payment estimate */
const TAX_RATE = 0.0055, INSURANCE = 175;
function payment(price, downPct, ratePct){
  const loan = price*(1-downPct/100), r = ratePct/1200, n = 360;
  const pi = r ? loan*r/(1-Math.pow(1+r,-n)) : loan/n;
  return pi + price*TAX_RATE/12 + INSURANCE;
}
function paymentHTML(l){
  if (!l.price) return "";
  return `<details class="pay" data-price="${l.price}"><summary><span>Estimated payment</span><span><b id="payOut">${money(payment(l.price,20,6.5))}</b>/mo</span></summary>
    <div class="row2"><div><label for="payDown">Down payment (%)</label><input id="payDown" data-pay inputmode="decimal" value="20"></div><div><label for="payRate">Interest rate (%)</label><input id="payRate" data-pay inputmode="decimal" value="6.5"></div></div>
    <p class="addr">30-year fixed principal and interest, plus estimated property tax (${(TAX_RATE*100).toFixed(2)}% a year) and $${INSURANCE}/month insurance. HOA dues aren’t included. This is an estimate, not a loan offer; enter the rate from your own quote.</p>
    <a class="btn gold" href="https://nestkey.ai" target="_blank" rel="noopener">Get pre-qualified</a></details>`;
}

/* CMAs */
function cmaComps(cma){
  const sub = cma.subject||{};
  return marketingPool().filter(l=>l.key!==cma.subjectKey && !l.exclusive).map(l=>{
    let score = 0; if (l.hood===sub.hood) score += 3; if (l.type===sub.type) score += 2;
    if (sub.sqft && l.sqft) score += Math.max(0, 2 - Math.abs(l.sqft-sub.sqft)/sub.sqft*4);
    if (sub.beds) score += Math.max(0, 1 - Math.abs(l.beds-sub.beds)*0.5);
    if (sub.year && l.year) score += Math.max(0, 1 - Math.abs(l.year-sub.year)/40);
    if (l.status==="Pending" || l.status==="Closed") score += 0.5;
    return { l, score };
  }).sort((a,b)=>b.score-a.score);
}
// Brokerage-set adjustment rates (Company hub, CMA settings). Agents can add their own on top.
const CMA_RATE_DEFAULTS = { sizePct:50, bed:10000, bath:12500, agePerDecade:5000, ageCap:40000, activePct:2 };
const cmaRates = ()=>({ ...CMA_RATE_DEFAULTS, ...((window.Office && Office.conn && Office.conn.cmaRates) || {}) });
// Each adjustment moves the comp's price toward what it would be if it matched the subject.
function cmaAutoAdj(sub, l, basePpsf){
  const R = cmaRates(), parts = [];
  const add = (label, amt)=>{ amt = Math.round(amt/500)*500; if (amt) parts.push({ label, amt }); };
  if (sub.sqft && l.sqft && basePpsf) add(`Size (${(sub.sqft-l.sqft>0?"+":"")}${(sub.sqft-l.sqft).toLocaleString()} sq ft)`, (sub.sqft-l.sqft)*basePpsf*R.sizePct/100);
  if (sub.beds!=null && l.beds!=null && sub.beds!==l.beds) add(`Bedrooms (${sub.beds-l.beds>0?"+":""}${sub.beds-l.beds})`, (sub.beds-l.beds)*R.bed);
  if (sub.baths!=null && l.baths!=null && sub.baths!==l.baths) add(`Bathrooms (${sub.baths-l.baths>0?"+":""}${sub.baths-l.baths})`, (sub.baths-l.baths)*R.bath);
  if (sub.year && l.year && Math.abs(sub.year-l.year)>=10){ const v = Math.max(-R.ageCap, Math.min(R.ageCap, (sub.year-l.year)/10*R.agePerDecade)); add(`Age (built ${l.year})`, v); }
  if (l.status==="Active" || l.status==="Coming Soon") add("Active listing, not yet sold", -l.price*R.activePct/100);
  return parts;
}
function cmaCalc(cma){
  const sub = cma.subject||{}, auto = cma.autoAdj!==false;
  const comps = (cma.compKeys||[]).map(k=>listingSync(k)).filter(l=>l && l.sqft && l.price);
  const basePpsf = median(comps.map(l=>l.price/l.sqft));
  const rows = comps.map(l=>{
    const parts = auto ? cmaAutoAdj(sub, l, basePpsf) : [];
    const other = Number(cma.adj?.[l.key]||0);
    const autoTotal = parts.reduce((t,p)=>t+p.amt,0), adj = autoTotal + other, ap = l.price + adj;
    // Common appraisal guideline: net over 15% or gross over 25% of price suggests a weak comp.
    const gross = parts.reduce((t,p)=>t+Math.abs(p.amt),0) + Math.abs(other);
    const heavy = Math.abs(adj) > l.price*0.15 || gross > l.price*0.25;
    return { l, parts, autoTotal, other, adj, ap, ppsf:ap/l.sqft, gross, heavy };
  });
  if (!rows.length || !sub.sqft) return { rows, value:0, low:0, high:0, auto };
  const r5k = v=>Math.round(v/5000)*5000;
  // With automatic adjustments, value comes from the adjusted prices; without them, from adjusted price per square foot.
  const vals = (auto ? rows.map(r=>r.ap) : rows.map(r=>r.ppsf*sub.sqft)).sort((a,b)=>a-b);
  const q = p=>{ const i = (vals.length-1)*p, lo = Math.floor(i), hi = Math.ceil(i); return vals[lo]+(vals[hi]-vals[lo])*(i-lo); };
  return { rows, value:r5k(median(vals)), low:r5k(q(.25)), high:r5k(q(.75)), mppsf:median(rows.map(r=>r.ppsf)), auto, heavy:rows.filter(r=>r.heavy).length, method: auto ? "adjusted sale price" : "adjusted price per square foot" };
}

  const days = Array.from({ length:14 }, (_,i)=>{ const d = new Date(); d.setDate(d.getDate()-13+i); return d.toLocaleDateString("en-CA"); });
  const dayOf = iso=>iso ? new Date(iso).toLocaleDateString("en-CA") : "";
  const counts = days.map(d=>items.filter(i=>dayOf(i.addedAt)===d).length + items.filter(i=>i.reaction && dayOf(i.updatedAt)===d && dayOf(i.addedAt)!==d).length + reqs.filter(r=>dayOf(r.createdAt)===d).length);
  const mx = Math.max(...counts,1);
  const bars = counts.map((v,i)=>`<rect x="${i*25+4}" y="${100-v/mx*90}" width="17" height="${Math.max(v/mx*90,1)}" rx="3" fill="${v?"var(--accent)":"var(--line)"}"><title>${days[i]}: ${v}</title></rect>${i%2===0?`<text x="${i*25+12}" y="116" text-anchor="middle">${Number(days[i].slice(8))}</text>`:""}`).join("");
  return `<p class="addr">Last 30 days of client activity in the app.</p>
    <div class="stats">${stat(items.filter(i=>recent(i.addedAt)).length,"Homes saved")}${stat(items.filter(i=>i.reaction==="love"&&recent(i.updatedAt||i.addedAt)).length,"Loves")}${stat(reqs.filter(r=>recent(r.createdAt)).length,"Showing requests")}${stat(active.size,"Active clients")}</div>
    <div class="chart"><svg viewBox="0 0 352 122" role="img" aria-label="Client activity per day over the last 14 days">${bars}</svg></div>
    <h3 class="agent-h">Most engaged homes</h3>
    ${top.length?`<div class="scroll"><table class="mtable"><thead><tr><th>Home</th><th>Saves</th><th>Loves</th><th>Passes</th><th>Requests</th></tr></thead><tbody>${top.map(x=>`<tr><td>${esc(x.l.address)}</td><td>${x.e.saves}</td><td>${x.e.love}</td><td>${x.e.pass}</td><td>${x.e.requests}</td></tr>`).join("")}</tbody></table></div>`:`<p class="addr">No client activity yet.</p>`}`;
}

async function exportCSV(){
  const rows = [["Received","Name","Email","Phone","Property","MLS key","Status","Message"]].concat(
    allRequests().map(r=>[r.createdAt,r.name,r.email,r.phone,r.address,r.listingKey,r.status,r.message]));
  const csv = rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  try{
    const dl = await window.claude.use("downloads");
    if (!dl){ toast("Downloads aren’t available here."); return; }
    await dl.save({ filename:`showing-requests-${new Date().toISOString().slice(0,10)}.csv`, data:csv });
  }catch(e){ /* viewer declined */ }
}

/* Routing (#search, #map, #collections, #agent) */
const VIEWS = ["search","map","collections","agent"];
function route(){
  const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "search";
  VIEWS.forEach(n=>$("#v-"+n).classList.toggle("hidden", n!==v));
  document.querySelectorAll("nav.tabs a").forEach(a=>{ if(a.dataset.view===v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  const side = v==="collections" || v==="agent";
  $("#searchUI").classList.toggle("hidden", side);
  $("#dataBanner").classList.toggle("hidden", side || IDX.MODE!=="sample");
  if (v==="collections") renderCollections();
  if (v==="agent") renderAgent();
}

  if (p4){
    const d = p4.dataset;
    if (d.savesearch!==undefined){ const f = filters(); const name = prompt("Name this search", describeFilters(f)); if (name && name.trim()){ activeSearch = Store.saveSearch(null, { name:name.trim(), filters:f, seenKeys:results.map(l=>l.key), createdAt:new Date().toISOString() }); renderSearch(); } }

    else if (d.managesearch!==undefined) openManageSearches();
    else if (d.delsearch!==undefined){ Store.saveSearch(d.delsearch, null); if (activeSearch===d.delsearch) activeSearch = null; openManageSearches(); }
    else if (d.viewsearch!==undefined){ const [cid,sid] = d.viewsearch.split("|"); const sv = Store.clients[cid]?.searches?.[sid]; if (sv){ applyFilters(sv.filters||{}); activeSearch = null; location.hash = "search"; runSearch(); } }
    else if (d.share!==undefined) shareApp();
    else if (d.newoh!==undefined) openOHForm(null);
    else if (d.ohfor!==undefined) openOHForm(null, d.ohfor);
    else if (d.editoh!==undefined) openOHForm(d.editoh);
    else if (d.deloh!==undefined){ if (confirm("Delete this open house?")){ Store.saveOpenHouse(d.deloh, null); $("#dlgForm").close(); } }
    else if (d.signin!==undefined) openSignIn(d.signin);
    else if (d.ohcontact!==undefined){ const v = Store.crm.ohvisitors[d.ohcontact]; const o = v && Store.crm.openhouses[v.ohId]; if (v) openContactForm(null, { name:v.name, email:v.email, phone:v.phone, role:"buyer", notes:`Signed in at the open house at ${o?addrOf(o.listingKey):"a listing"} on ${o?dayLabel(o.date):""}. Working with an agent: ${v.agent}. Pre-approved: ${v.preapproved}.` }); }
    else if (d.newcma!==undefined) openCMAForm();
    else if (d.cmafor!==undefined) openCMAForm(d.cmafor);
    else if (d.delcma!==undefined){ if (confirm("Delete this CMA?")){ Store.saveCrm("cmas", d.delcma, null); agentPanel = "cmas"; renderAgent(); } }
    else if (d.cmasummary!==undefined) cmaSummary(d.cmasummary);
    else if (d.cmacsv!==undefined) cmaCSV(d.cmacsv);
    else if (d.cmareport!==undefined) window.CMAReport ? CMAReport.open(d.cmareport) : toast("The report tool didn’t load. Reload the page.");
    else if (d.cmarates!==undefined) window.CMAReport?.openRates();
    else if (d.cmacontact!==undefined) quickCMA(d.cmacontact);
    else if (d.mklisting!==undefined){ mk.key = d.mklisting; mk.caps = null; agentPanel = "marketing"; renderAgent(); window.scrollTo(0,0); }
    else if (d.newshow!==undefined){ const n = prompt("Name this Miller Pick list"); if (n && n.trim()){ const id = Store.saveShowcase(null, { name:n.trim(), description:"", keys:[], createdAt:new Date().toISOString() }); agentPanel = "showcase:"+id; renderAgent(); } }
    else if (d.delshow!==undefined){ if (confirm("Delete this Miller Pick list?")){ Store.saveShowcase(d.delshow, null); agentPanel = "showcase"; renderAgent(); } }
    else if (d.showremove!==undefined){ const [id,k] = d.showremove.split("|"); editShowcase(id, x=>{ x.keys = x.keys.filter(y=>y!==k); }); }
    else if (d.openshow!==undefined){ openShow = d.openshow; renderCollections(); window.scrollTo(0,0); }
    else if (d.closeshow!==undefined){ openShow = null; renderCollections(); }
    return;
  }
  const cl = e.target.closest("[data-copylink],[data-copymine]");
  if (cl){ const url = cl.dataset.copymine!==undefined ? myLink() : IDX.APP_URL + "?agent=" + encodeURIComponent(cl.dataset.copylink);
    (navigator.clipboard?.writeText(url)||Promise.reject()).then(()=>toast("Link copied")).catch(()=>window.prompt("Copy this link", url)); return; }
  const p3 = e.target.closest("[data-newex],[data-editex],[data-delex],[data-mkpng],[data-mkcaps],[data-copy],[data-aiask],[data-aiclear],[data-newagent],[data-editagent],[data-delagent]");
  if (p3){
    const d = p3.dataset;
    if (d.newex!==undefined) openExclusiveForm(null);
    else if (d.editex!==undefined) openExclusiveForm(d.editex);
    else if (d.delex!==undefined){ if (confirm("Delete this listing? It will also leave client search.")){ Store.saveExclusive(d.delex, null); $("#dlgForm").close(); } }
    else if (d.mkpng!==undefined) downloadFlyer();
    else if (d.mkcaps!==undefined) writeCaptions();
    else if (d.copy!==undefined){ const ta = document.getElementById(d.copy); ta.select(); (navigator.clipboard?.writeText(ta.value)||Promise.reject()).then(()=>{ p3.textContent="Copied"; setTimeout(()=>p3.textContent="Copy",1500); }).catch(()=>{ try{ document.execCommand("copy"); p3.textContent="Copied"; }catch(_){ } }); }
    else if (d.aiask!==undefined) askAI(d.aiask);
    else if (d.aiclear!==undefined){ ai.ctl?.abort(); ai = { msgs:[], busy:false, ctl:null }; renderAgent(); }
    else if (d.newagent!==undefined) openInviteForm();
    else if (d.editagent!==undefined) openAgentForm(d.editagent);
    else if (d.delagent!==undefined){ if (confirm("Remove this agent? They lose the agent tools, and their profile leaves the Team page. Their clients stay assigned to them until you reassign.")){ window.MillerCloud?.rpc?.("remove_agent", { agent_id:d.delagent }).catch(()=>{}); Store.saveRoster(d.delagent, null); $("#dlgForm").close(); } }
    return;
  }
  const tr = e.target.closest("[data-newtour],[data-deltour],[data-stopmove],[data-stopdel],[data-optimize],[data-addloved],[data-editgoals]");
  if (tr){
    const d = tr.dataset;
    if (d.newtour!==undefined) newTour(d.newtour);
    else if (d.deltour!==undefined){ if (confirm("Delete this showing day?")){ Store.saveTour(d.deltour, null); agentPanel = "tours"; renderAgent(); } }
    else if (d.stopmove!==undefined){ const [id,i,dir] = d.stopmove.split("|"); editTour(id, t=>{ const a=+i, b=a+(+dir); if (b<0||b>=t.stops.length) return; [t.stops[a],t.stops[b]] = [t.stops[b],t.stops[a]]; }); }
    else if (d.stopdel!==undefined){ const [id,i] = d.stopdel.split("|"); editTour(id, t=>t.stops.splice(+i,1)); }
    else if (d.optimize!==undefined) editTour(d.optimize, t=>{ t.stops = optimizeStops(t.stops); });
    else if (d.addloved!==undefined) editTour(d.addloved, t=>{ const c = Store.crm.contacts[t.contactId]; if (!c||!c.clientId) return; clientItems(c.clientId).filter(i=>i.reaction==="love" && !t.stops.some(s=>s.listingKey===i.key)).forEach(i=>t.stops.push({ listingKey:i.key, time:"", note:"" })); });
    else if (d.editgoals!==undefined) openGoalsForm();
    return;
  }
  const a = e.target.closest("[data-panel],[data-newcontact],[data-newtask],[data-editcontact],[data-edittask],[data-addcontact],[data-delcontact],[data-deltask]");
  if (a){
    const d = a.dataset;
    if (d.panel!==undefined){
      if (d.panel==="notifications"){ notifPrevSeen = Store.settings.notifSeenAt||""; Store.saveSettings({ notifSeenAt:new Date().toISOString() }); }
      agentPanel = d.panel;
      if (location.hash!=="#agent") location.hash = "agent";
      renderAgent(); window.scrollTo(0,0);
    }
    else if (d.newcontact!==undefined) openContactForm(null, d.newcontact==="seller" ? { role:"seller" } : {});
    else if (d.newtask!==undefined) openTaskForm(null, d.newtask);
    else if (d.editcontact!==undefined) openContactForm(d.editcontact);
    else if (d.edittask!==undefined) openTaskForm(d.edittask);
    else if (d.addcontact!==undefined){ const [cid,rid] = d.addcontact.split("|"); const r = Store.leads[cid]?.requests?.[rid]||{}; openContactForm(null, { name:r.name||"", email:r.email||"", phone:r.phone||"", clientId:cid, notes:r.address?`Requested a showing at ${r.address}.`:"" }); }
    else if (d.delcontact!==undefined){ if (confirm("Delete this contact?")){ Store.saveCrm("contacts", d.delcontact, null); $("#dlgForm").close(); } }
    else if (d.deltask!==undefined){ Store.saveCrm("tasks", d.deltask, null); $("#dlgForm").close(); }
    return;
  }
  const t = e.target.closest("[data-save],[data-open],[data-pin],[data-pick],[data-close],[data-col],[data-back],[data-newcol],[data-delcol],[data-react],[data-unsave]");
  if (!t) return;
  const d = t.dataset;
  if (d.save!==undefined){ e.stopPropagation(); openSave(d.save); }
  else if (d.open!==undefined){ e.preventDefault(); openListing(d.open); }
  else if (d.pin!==undefined){ selectedPin = d.pin; renderMap(); }
  else if (d.pick!==undefined) Store.toggle(d.pick, saveKey);
  else if (d.close!==undefined) t.closest("dialog").close();
  else if (d.col!==undefined){ openCol = d.col; renderCollections(); window.scrollTo(0,0); }
  else if (d.back!==undefined){ openCol = null; renderCollections(); }
  else if (d.newcol!==undefined){ const n = prompt("Name this shortlist"); if (n && n.trim()){ openCol = Store.create(n.trim()); renderCollections(); } }
  else if (d.delcol!==undefined){ if (confirm("Delete this shortlist and its notes?")){ Store.remove(d.delcol); openCol=null; renderCollections(); } }
  else if (d.react!==undefined){ const cur = Store.cols[openCol]?.items?.[d.key]?.reaction; Store.setItem(openCol, d.key, { reaction: cur===d.react ? "" : d.react }); }
  else if (d.unsave!==undefined){ Store.toggle(openCol, d.unsave); }
});
document.addEventListener("keydown", e=>{
  if ((e.key==="Enter"||e.key===" ") && e.target.matches("[data-open],[data-pin]")){ e.preventDefault(); e.target.click(); }
});
document.addEventListener("change", e=>{
  if (e.target.matches("[data-note]")) Store.setItem(openCol, e.target.dataset.note, { note: e.target.value.trim() });
  if (e.target.matches("[data-cmaadj]")){ const [id,k] = e.target.dataset.cmaadj.split("|"); const v = parseFloat(String(e.target.value).replace(/[$,\s]/g,"")); editCMA(id, c=>{ if (isFinite(v) && v) c.adj[k] = v; else delete c.adj[k]; }); }
  if (e.target.matches("[data-cmaauto]")){ editCMA(e.target.dataset.cmaauto, c=>{ c.autoAdj = e.target.checked; }); }
  if (e.target.matches("[data-cmacomp]")){ const [id,k] = e.target.dataset.cmacomp.split("|"); editCMA(id, c=>{ c.compKeys = e.target.checked ? [...new Set([...c.compKeys,k])] : c.compKeys.filter(x=>x!==k); }); }
  if (e.target.matches("[data-cmafield]")){ const [id,f] = e.target.dataset.cmafield.split("|"); editCMA(id, c=>{ c[f] = e.target.value; }); }
  if (e.target.matches("[data-showfield]")){ const [id,f] = e.target.dataset.showfield.split("|"); editShowcase(id, x=>{ x[f] = e.target.value.trim(); }); }
  if (e.target.matches("[data-showadd]") && e.target.value){ const id = e.target.dataset.showadd, k = e.target.value; editShowcase(id, x=>{ if (!x.keys.includes(k)) x.keys.push(k); }); }
  if (e.target.matches("[data-mk]")){ mk[e.target.dataset.mk] = e.target.value; if (e.target.dataset.mk==="key"||e.target.dataset.mk==="tpl") mk.caps = null; renderAgent(); }
  if (e.target.matches("[data-tourfield]")){
    const [id,field] = e.target.dataset.tourfield.split("|");
    editTour(id, t=>{
      if (field==="shared") t.shared = e.target.checked;
      else if (field==="contactId"){ t.contactId = e.target.value; t.clientId = Store.crm.contacts[t.contactId]?.clientId||""; if (!t.clientId) t.shared = false; }
      else t[field] = e.target.value.trim();
    });
  }
  if (e.target.matches("[data-stopfield]")){ const [id,i,field] = e.target.dataset.stopfield.split("|"); editTour(id, t=>{ if (t.stops[+i]) t.stops[+i][field] = e.target.value.trim(); }); }
  if (e.target.matches("[data-addstop]") && e.target.value){ const id = e.target.dataset.addstop, k = e.target.value; editTour(id, t=>{ if (!t.stops.some(s=>s.listingKey===k)) t.stops.push({ listingKey:k, time:"", note:"" }); }); }
  if (e.target.matches("[data-stage]")){ const [id,field] = e.target.dataset.stage.split("|"); const c = Store.crm.contacts[id]; if (c) Store.saveCrm("contacts", id, { ...c, [field]:e.target.value, updatedAt:new Date().toISOString() }); }
  if (e.target.matches("[data-taskdone]")){ const id = e.target.dataset.taskdone; const t = Store.crm.tasks[id]; if (t) Store.saveCrm("tasks", id, { ...t, done:e.target.checked, doneAt:e.target.checked?new Date().toISOString():"" }); }
  if (e.target.matches("[data-status]")){ const [cid,rid] = e.target.dataset.status.split("|"); Store.setLeadStatus(cid, rid, e.target.value); }
});
$("#dlgChat").addEventListener("close", ()=>Store.markRead(Store.uid, "client"));
document.querySelectorAll("dialog").forEach(dl=>dl.addEventListener("click", e=>{ if (e.target===dl) dl.close(); }));
document.addEventListener("input", e=>{
  if (e.target.matches("[data-pay]")){ const box = e.target.closest("details.pay"); const out = box && box.querySelector("#payOut"); const dn = parseFloat($("#payDown").value), rt = parseFloat($("#payRate").value);
    if (out && isFinite(dn) && isFinite(rt) && dn>=0 && dn<100 && rt>=0) out.textContent = money(payment(+box.dataset.price, dn, rt)); }
});
document.addEventListener("input", e=>{ if (e.target.id==="toolFind"){ toolQuery = e.target.value; filterTools(); } });
document.addEventListener("input", e=>{ if (e.target.id==="rosterQ"){ rosterQuery = e.target.value; const l = $("#rosterList"); if (l) l.innerHTML = rosterCards(); } });
document.addEventListener("keydown", e=>{ if (e.target.id==="aiText" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); askAI(e.target.value); } });
let qTimer; $("#q").addEventListener("input", ()=>{ activeSearch = null; clearTimeout(qTimer); qTimer = setTimeout(runSearch, 250); });
["#fPrice","#fBeds","#fType","#fStatus","#fSort"].forEach(s=>$(s).addEventListener("change", ()=>{ activeSearch = null; runSearch(); }));
window.addEventListener("hashchange", route);

let lastExVer = 0;
Store.onChange(()=>{
  if (Store.exVer!==lastExVer){ lastExVer = Store.exVer; runSearch(); lastSearchVer = -1; }
  if (Store.searchVer!==lastSearchVer){ lastSearchVer = Store.searchVer; refreshSearchCounts(); }
  if (!$("#v-search").classList.contains("hidden")) renderSearch();
  if (!$("#v-map").classList.contains("hidden")) renderMap();
  if (!$("#v-collections").classList.contains("hidden")) renderCollections();
  const ae = document.activeElement, typing = ae && $("#v-agent").contains(ae) && ae.matches("input,select,textarea");
  if (!$("#v-agent").classList.contains("hidden") && (agentPanel.startsWith("thread:") || !typing)) renderAgent();
  if ($("#dlgChat").open) updateClientChat();
  $("#agentTab").classList.toggle("hidden", !Store.isAgent);
  if (Store.isAgent){ const n = unseenCount(); $("#agentBadge").textContent = n ? (n>99?"99+":String(n)) : ""; }
  if ($("#dlgSave").open) renderSave();
});

$("#disclaimer").textContent = `${IDX.DISCLAIMER} Listing data provided by ${IDX.MLS_NAME}. ${IDX.BROKER.firm}.`;
try{ const a = new URLSearchParams(location.search).get("agent"); if (a) localStorage.setItem("tmg-agent-slug", a.toLowerCase()); }catch(e){}
route(); runSearch(); Store.init();
</script>
