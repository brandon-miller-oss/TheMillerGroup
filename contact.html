<body>
<a class="skip" href="#main">Skip to content</a>

<main id="main">
<section class="page-hero"><div class="wrap"><h1>Get in touch</h1><p>Tell us what you’re looking for and we’ll reply within one business day.</p></div></section>
<section class="section"><div class="wrap two-col">
<div class="prose"><h2 style="margin-top:0">Reach us directly</h2>
<p><a id="cPhone" href="tel:+13039900702">303-990-0702</a><br><a id="cEmail" href="mailto:hello@yourdomain.com">hello@yourdomain.com</a></p>
<p>Denver, Colorado</p></div>
<aside class="panel"><h2>Send a message</h2>
<form class="form" data-lead-form novalidate>
  
  <div class="two">
    <div class="field"><label for="f-name">Name</label><input id="f-name" name="name" required autocomplete="name"></div>
    <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" required autocomplete="email"></div>
  </div>
  <div class="two">
    <div class="field"><label for="f-phone">Phone (optional)</label><input id="f-phone" name="phone" type="tel" autocomplete="tel"></div>
    <div class="field"><label for="f-interest">I’m interested in</label><select id="f-interest" name="interest"><option>Buying a home</option><option>Selling a home</option><option>Leasing commercial space</option><option>Buying or selling commercial property</option><option>Development or land</option><option>Something else</option></select></div>
  </div>
  
  
  <div class="field"><label for="f-msg">How can we help?</label><textarea id="f-msg" name="message"></textarea></div>
  <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button class="btn btn-gold" type="submit" style="justify-self:start">Send message</button>
  <p class="form-note" role="status"></p>
  <p class="fine" style="margin-top:0">By sending this you agree we may contact you about your request. See our <a href="privacy-policy.html">privacy policy</a>.</p>
</form></aside>
</div></section>
