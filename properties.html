<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denver and Colorado Homes for Sale | The Miller Group</title>
<meta name="description" content="Browse current listings, coming soon properties and recent sales from The Miller Group across Denver, the Front Range and the mountains.">
<meta property="og:title" content="Denver and Colorado Homes for Sale | The Miller Group">
<meta property="og:description" content="Browse current listings, coming soon properties and recent sales from The Miller Group across Denver, the Front Range and the mountains.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310231F'/%3E%3Cpath d='M8 50 26 20l9 14 6-9 15 25z' fill='%23F0B23A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/config.js"></script>

</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<script src="assets/layout.js" data-part="header"></script>
<main id="main">
<section class="page-hero"><div class="wrap"><h1>Listings</h1><p>Homes, commercial space and land. Ask us about off-market options too.</p></div></section>
<section class="section"><div class="wrap">
<div class="filters" role="group" aria-label="Listing status">
<button type="button" data-tab="active" aria-pressed="true">For sale</button>
<button type="button" data-tab="coming_soon" aria-pressed="false">Coming soon</button>
<button type="button" data-tab="sold" aria-pressed="false">Recently sold</button>
</div>
<p id="cityNote" class="fine" hidden></p>
<ul class="rows" id="rows"><li class="empty">Loading...</li></ul>
<p class="fine">Listing information is deemed reliable but not guaranteed.</p>
</div></section>
</main>
<script src="assets/layout.js" data-part="footer"></script>
<script src="assets/site.js"></script>
<script>
(async function(){
  var rows=document.getElementById('rows'),items=[],tab='active';
  var city=new URLSearchParams(location.search).get('city')||'';
  var sb=await MG.client();
  if(!sb){rows.innerHTML='<li class="empty">Listings will appear here once the database is connected.</li>';return}
  var r=await sb.from('listings').select('*').eq('published',true).order('featured',{ascending:false}).order('created_at',{ascending:false});
  if(r.error){rows.innerHTML='<li class="empty">We couldn’t load listings right now. Please try again soon.</li>';return}
  items=r.data;
  if(city){var n=document.getElementById('cityNote');n.hidden=false;n.innerHTML='Showing listings in '+MG.esc(city)+'. <a href="properties.html">Show all</a>'}
  function icon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-6h4v6"/></svg>'}
  function draw(){
    var list=items.filter(function(l){return l.status===tab&&(!city||(l.city||'').toLowerCase()===city.toLowerCase())});
    if(!list.length){rows.innerHTML='<li class="empty">Nothing here right now. Ask us what’s coming.</li>';return}
    rows.innerHTML=list.map(function(l){
      var facts=[l.beds?l.beds+' bed':'',l.baths?l.baths+' bath':'',l.sqft?Number(l.sqft).toLocaleString()+' sq ft':''].filter(Boolean).join(', ');
      var thumb=l.photo_url?'<div class="thumb home" style="overflow:hidden"><img src="'+MG.esc(l.photo_url)+'" alt="" style="width:100%;height:100%;object-fit:cover"></div>':'<div class="thumb home">'+icon()+'</div>';
      var price=l.price?(l.status==='sold'?'Sold ':'')+MG.money(l.price):'Price on request';
      var link=l.link_url?'<p class="facts"><a href="'+MG.esc(l.link_url)+'" rel="noopener">View details</a></p>':'';
      return '<li class="row">'+thumb+'<div><h3>'+MG.esc(l.title)+'</h3><p class="where">'+MG.esc([l.address,l.city].filter(Boolean).join(', '))+'</p>'+(facts?'<p class="facts">'+MG.esc(facts)+'</p>':'')+link+'</div><div class="price">'+price+'</div></li>';
    }).join('');
  }
  document.querySelectorAll('[data-tab]').forEach(function(b){b.addEventListener('click',function(){
    tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});draw();
  })});
  draw();
})();
</script>
</body>
</html>
