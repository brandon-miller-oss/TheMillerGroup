<body>
<a class="skip" href="#main">Skip to content</a>
<script src="assets/layout.js" data-part="header"></script>
<main id="main">
<section class="page-hero"><div class="wrap"><h1>What clients say</h1><p>Kind words from people we’ve worked with.</p></div></section>
<section class="section"><div class="wrap"><div id="list" style="max-width:46rem"><p class="empty">Loading...</p></div></div></section>
</main>
<script src="assets/layout.js" data-part="footer"></script>
<script src="assets/site.js"></script>
<script>
(async function(){
  var box=document.getElementById('list'),sb=await MG.client();
  if(!sb){box.innerHTML='<p class="empty">Testimonials will appear here once the database is connected.</p>';return}
  var r=await sb.from('testimonials').select('*').eq('published',true).order('created_at',{ascending:false});
  if(r.error||!r.data.length){box.innerHTML='<p class="empty">Testimonials are coming soon.</p>';return}
  box.innerHTML=r.data.map(function(t){return '<div class="quote"><blockquote>“'+MG.esc(t.quote)+'”</blockquote><cite>'+MG.esc(t.author)+(t.location?', '+MG.esc(t.location):'')+'</cite></div>'}).join('');
})();
</script>
</body>
</html>
