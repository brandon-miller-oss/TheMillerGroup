<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colorado Real Estate Blog | The Miller Group</title>
<meta name="description" content="Home buying and selling tips and Denver area neighborhood news from The Miller Group.">
<meta property="og:title" content="Colorado Real Estate Blog | The Miller Group">
<meta property="og:description" content="Home buying and selling tips and Denver area neighborhood news from The Miller Group.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310231F'/%3E%3Cpath d='M8 50 26 20l9 14 6-9 15 25z' fill='%23F0B23A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/config.js"></script>

</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<script src="assets/layout.js" data-part="header"></script>
<main id="main">
<section class="page-hero"><div class="wrap"><h1>Blog</h1><p>Buying and selling tips, plus news from the neighborhoods we work in.</p></div></section>
<section class="section"><div class="wrap">
<div class="filters" role="group" aria-label="Category">
<button type="button" data-cat="all" aria-pressed="true">All</button>
<button type="button" data-cat="Buying and selling tips" aria-pressed="false">Buying and selling tips</button>
<button type="button" data-cat="Neighborhood news" aria-pressed="false">Neighborhood news</button>
</div>
<ul class="list-links" id="posts" style="margin-top:18px"><li class="empty">Loading...</li></ul>
</div></section>
</main>
<script src="assets/layout.js" data-part="footer"></script>
<script src="assets/site.js"></script>
<script>
(async function(){
  var box=document.getElementById('posts'),items=[],cat='all';
  var sb=await MG.client();
  if(!sb){box.innerHTML='<li class="empty">Posts will appear here once the database is connected.</li>';return}
  var r=await sb.from('posts').select('slug,title,excerpt,category,published_at').eq('published',true).order('published_at',{ascending:false});
  if(r.error){box.innerHTML='<li class="empty">We couldn’t load posts right now.</li>';return}
  items=r.data;
  function draw(){
    var list=items.filter(function(p){return cat==='all'||p.category===cat});
    if(!list.length){box.innerHTML='<li class="empty">No posts yet. Check back soon.</li>';return}
    box.innerHTML=list.map(function(p){
      var d=p.published_at?new Date(p.published_at).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}):'';
      return '<li><div><h3><a href="post.html?slug='+encodeURIComponent(p.slug)+'" style="text-decoration:none">'+MG.esc(p.title)+'</a></h3><p>'+MG.esc(p.excerpt||'')+'</p><p class="post-meta">'+MG.esc([p.category,d].filter(Boolean).join(' | '))+'</p></div><a class="link-btn" href="post.html?slug='+encodeURIComponent(p.slug)+'">Read</a></li>';
    }).join('');
  }
  document.querySelectorAll('[data-cat]').forEach(function(b){b.addEventListener('click',function(){
    cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});draw();
  })});
  draw();
})();
</script>
</body>
</html>
